map $http_x_forwarded_proto $client_proto {
    default $scheme;
    https https;
}

# Giao diện người dân.
server {
    listen 80;
    server_name chat.tthc-gialai.id.vn;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    # Client không được gọi API quản trị, kể cả khi biết URL.
    location ^~ /api/admin {
        return 404;
    }

    # Không phục vụ giao diện admin trên subdomain người dân.
    location ~ ^/admin(/|$) {
        return 302 https://admin.tthc-gialai.id.vn$request_uri;
    }

    # API + SSE. Tắt buffering để token của chatbot tới trình duyệt ngay.
    location ~ ^/(chat|search|procedures|api)/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~* \.(?:png|jpg|jpeg|svg|ico|webp|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}

# Giao diện quản trị.
server {
    listen 80;
    server_name admin.tthc-gialai.id.vn;
    server_tokens off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    # Chỉ admin mới dùng API admin; backend vẫn kiểm tra auth.
    location ~ ^/(chat|search|procedures|api)/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = / {
        return 302 /admin;
    }

    location ^~ /admin {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:png|jpg|jpeg|svg|ico|webp|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        return 302 /admin;
    }
}
