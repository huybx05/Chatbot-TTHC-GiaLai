name: tracuutthc

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_DB:-chatbot_tthc}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=60
    volumes:
      # PostgreSQL 18 dùng /var/lib/postgresql (PGDATA nằm dưới /18/docker),
      # không phải /var/lib/postgresql/data như 16.
      - postgres-data:/var/lib/postgresql
    networks: [data]
    mem_limit: 768m
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DATABASE_DB:-chatbot_tthc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
  
  s3:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    command:
      - mini
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    networks: [data]
    volumes:
      - seaweedfs-data:/data
      - /opt/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    mem_limit: 256m
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    networks: [data]
    mem_limit: 96m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [data]
    mem_limit: 512m
    logging: *default-logging

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 384m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks: [data]
    mem_limit: 1280m
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$NEO4J_PASSWORD\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks: [data]
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: tracuutthc-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DEBUG: "False"
      FORCE_HTTPS: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      TRUSTED_PROXY_IPS: "172.16.0.0/12,127.0.0.1,::1"
      DATABASE_URL: postgresql+psycopg://${DATABASE_USER:?set DATABASE_USER in .env}:${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}@postgres:5432/${DATABASE_DB:-chatbot_tthc}
      NEO4J_URL: neo4j://neo4j:7687
      NEO4J_DATABASE: neo4j
      NEO4J_RUN_ID: full
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      QDRANT_HOST: http://qdrant:6333
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: ${S3_ENDPOINT_DOCKER:-http://host.docker.internal:8333}
      WEB_CONCURRENCY: "2"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      s3:
        condition: service_started
      neo4j:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks: [edge, data]
    volumes:
      - app-logs:/app/logs
    mem_limit: 1g
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: tracuutthc-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge]
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # Tùy chọn: Cloudflare Tunnel để không mở port 80/443 ra Internet.
  # Bật bằng: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      frontend:
        condition: service_healthy
    networks: [edge]
    mem_limit: 64m
    logging: *default-logging

networks:
  edge:
  data:
    internal: true

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  neo4j-data:
  neo4j-logs:
  elasticsearch-data:
  app-logs:
  seaweedfs-data:
